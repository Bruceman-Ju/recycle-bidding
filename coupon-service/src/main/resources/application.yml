server:
  port: 8089

spring:
  application:
    name: coupon-service
  datasource:
    url: jdbc:mysql://localhost:3306/recycle_bidding?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rocketmq:
  name-server: localhost:9876
  producer:
    group: coupon-producer-group

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.recycle.bidding: DEBUG
