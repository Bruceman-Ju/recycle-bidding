version: '3.8'

services:
  registry:
    image: openjdk:17-slim
    container_name: recycle-registry
    ports:
      - "8761:8761"
    volumes:
      - ./registry/target/registry-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar /app/app.jar
    networks:
      - recycle-net

  order-service:
    image: openjdk:17-slim
    container_name: recycle-order
    ports:
      - "8082:8082"
    volumes:
      - ./order-service/target/order-service-1.0.0.jar:/app/app.jar
    working_dir: /app
    command: java -jar /app/app.jar
    depends_on:
      - registry
    networks:
      - recycle-net

  engineer-service:
