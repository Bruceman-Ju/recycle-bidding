server:
  port: 8086

# Netty WebSocket 端口（与 server.port 分开，避免冲突）
netty:
  websocket:
    port: 8090

spring:
  application:
    name: websocket-gateway
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rocketmq:
  name-server: localhost:9876
  producer:
    group: ws-gateway-producer

logging:
  level:
    com.recycle.bidding: DEBUG
