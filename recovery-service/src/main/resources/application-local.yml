server:
  port: 8091

spring:
  application:
    name: recovery-service
  datasource:
    url: jdbc:mysql://localhost:3306/recycle_bidding?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

recovery:
  scan:
    interval-ms: 30000
    page-size: 200
  auction-timeout-threshold-seconds: 240

logging:
  level:
    com.recycle.bidding.recovery: INFO
