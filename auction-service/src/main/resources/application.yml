server:
  port: 8085

spring:
  application:
    name: auction-service
  datasource:
    url: jdbc:mysql://localhost:3306/recycle_bidding?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: root123
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
  cloud:
    compatibility-verifier:
      enabled: false

eureka:
  client:
    serviceUrl:
      defaultZone: http://localhost:8761/eureka/

rocketmq:
  name-server: localhost:9876
  producer:
    group: auction-producer-group

nacos:
  config:
    server-addr: 127.0.0.1:8848
    namespace: 'recycle-bidding'
    group: RECYCLE_BIDDING
    data-id: auction-service-config

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.recycle.bidding: DEBUG
